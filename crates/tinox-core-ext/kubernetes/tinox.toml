[package]
name = "kubernetes"
version = "1.0.0"
description = "Kubernetes REST API client for tinox.core -- kubeconfig/in-cluster auth (incl. TLS client certs), a generic dynamic resource client that works with any Group/Version/Kind (including CRDs), and typed convenience classes for the common built-in resource kinds (Pod, Deployment, Service, ConfigMap, Secret, Job, Ingress, RBAC, ...)."

[[dependencies]]
group = "tinox.core"
artifactId = "json"
version = "1.0.0"

[[dependencies]]
group = "tinox.core"
artifactId = "http"
version = "1.0.1"

[[dependencies]]
group = "tinox.core"
artifactId = "yaml"
version = "1.0.0"
