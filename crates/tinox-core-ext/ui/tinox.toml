[package]
name = "ui"
version = "1.0.0"
description = "Tinox-UI -- a server-driven web UI framework (Vaadin/Phoenix LiveView-style): write your whole UI as a Tinox component tree running on the server, a thin generic JS client renders it and ships events back over a persistent WebSocket."

[[dependencies]]
group = "tinox.core"
artifactId = "json"
version = "1.0.0"

[[dependencies]]
group = "tinox.core"
artifactId = "http_server"
version = "1.0.1"

[[dependencies]]
group = "tinox.core"
artifactId = "websocket"
version = "1.0.1"
