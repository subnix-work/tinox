# CI gate (TESTPLAN 0.1): full `make check` on every push/PR —
# the same check as the local pre-push hook, including dogfood.
#
# Dogfood needs a jgrep-tinox checkout: locally it lives under
# ../jgrep-tinox, here it's checked out as a sibling directory
# (the repo is public, no token needed) and DOGFOOD_DIR points to it
# (the Makefile default ../jgrep-tinox matches the layout below).
#
# Toolchain: the Tinox compiler invokes llc/opt (llvm), cc (clang/gcc)
# and links against Boehm-GC (libgc-dev); the ORM e2e tests need the
# sqlite3 CLI (fixtures) and libsqlite3-dev (-lsqlite3), otherwise
# they'd be skipped. crates/tinox/tests/postgres_transactional.rs (issue
# #191, @Transactional) needs libpq-dev to compile the postgres runtime.c
# driver plus the psql CLI for its own independent verification query --
# it starts its own Postgres via `docker run` (ubuntu-latest ships docker
# preinstalled, no separate `services:` container needed) and SKIPs
# gracefully if docker or psql are missing, same pattern as the sqlite3
# check above.
#
# Core/extended stdlib split (see CLAUDE.md): examples/e2e/dogfood cases
# importing an extended-tier module (e.g. tinox.core.json, tinox.core.rest)
# now `tinox install` it for real from central.tinox-lang.de into the
# global ~/.tinox/repository/ cache — the `actions/cache` step below
# persists that cache across runs, so only the FIRST run after a change
# touches the network; every subsequent run restores it and installs
# nothing new (install_dep's own cache-hit check, pm.rs, skips the
# download entirely once the coordinate is already on disk).

name: check

on:
  push:
    branches: [main]
  pull_request:

# Bug 108: least-privilege default. This workflow only checks out code and
# runs `make check` -- it never needs to write to the repo, so read-only
# is enough even though actions/checkout persists a token by default.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          path: tinox

      # Bug 108: pinned to a specific commit SHA instead of floating on
      # jgrep-tinox's default branch. dogfood.sh (via `make check`) runs
      # `bash build.sh` and the test suite straight out of this checkout --
      # an unpinned ref means a compromise or malicious push to that repo
      # would execute arbitrary code in this CI run on the next push/PR,
      # with whatever the checkout token's permissions allow (see the
      # `permissions:` block above). Bump this SHA deliberately when
      # jgrep-tinox needs to move forward (e.g. after reviewing its diff),
      # not automatically.
      - uses: actions/checkout@v5
        with:
          repository: subnix-work/jgrep-tinox
          ref: 18f4eff03e5653df3d6b2da2bab5b8c7ae77d2c3 # main, as of 2026-08-02
          path: jgrep-tinox

      - name: Install system toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libgc-dev libsqlite3-dev sqlite3 libpq-dev postgresql-client

      - name: llc/opt available?
        run: |
          llc --version | head -2
          opt --version | head -2

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tinox

      # Global tinox package-manager cache (~/.tinox/repository/, see
      # pm.rs's global_dep_install_dir) -- coordinate-resolved extended-
      # tier stdlib dependencies land here, shared across every example/
      # e2e/dogfood case in one run AND across runs via this cache. Keyed
      # on a static string with a manually-bumped suffix: no single
      # lockfile spans every case's independently-synthesized tinox.toml,
      # so there's no natural hash to key on the way Cargo.lock keys the
      # rust-cache step above.
      - uses: actions/cache@v4
        with:
          path: ~/.tinox/repository
          key: tinox-pkg-cache-v1

      - name: make check
        run: make -C tinox check
