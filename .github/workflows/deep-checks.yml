# Weekly deep checks (TESTPLAN 2.3 + Phase 4): AddressSanitizer and
# checked run of the e2e/boundary suite, plus the libFuzzer harnesses
# in fuzz/*/ (issue #111, see fuzz/README.md) against their seed corpus.
# Deliberately not part of the push gate (runtime); cron + manually
# triggerable. No dogfood checkout needed — all three targets only
# build examples-independent suites. `make fuzz` needs no special
# handling here: its FUZZ_SECONDS?=60 default per target runs fine
# under the generic `make ${{ matrix.target }}` step below, just like
# asan/checked.
#
# Core/extended stdlib split (see CLAUDE.md, and check.yml's own note):
# the e2e suite (asan/checked targets) and 5 of the fuzz/*/ harnesses
# (fuzz target) both `tinox install` extended-tier stdlib dependencies
# for real now — same `actions/cache` treatment as check.yml, sharing
# the identical cache key so a check.yml run earlier in the week already
# warms this workflow's cache too.

name: deep-checks

on:
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC
  workflow_dispatch:

# Bug 108: same least-privilege default applied to check.yml -- this
# workflow only checks out and builds/tests the repo itself, never writes.
permissions:
  contents: read

jobs:
  deep:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [asan, tsan, checked, fuzz]
    steps:
      - uses: actions/checkout@v5

      - name: Install system toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libgc-dev libsqlite3-dev sqlite3

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/cache@v4
        with:
          path: ~/.tinox/repository
          key: tinox-pkg-cache-v1

      - name: make ${{ matrix.target }}
        run: make ${{ matrix.target }}
