[package]
compiler = "2.9.4"
name = "websocket-fuzz-driver"
version = "0.1.0"
description = "Local-only manifest so WsDriver.tnx can pull in the real tinox.core.websocket module as a dependency."

[[dependencies]]
group = "tinox.core"
artifactId = "websocket"
version = "1.1.9"

# Fuzz the in-tree source, not whatever happens to be published.
[[overrides]]
group = "tinox.core"
artifactId = "websocket"
path = "../../crates/tinox-core-ext/websocket"
