[package]
compiler = "2.9.2"
name = "crud"
version = "0.1.0"
description = "Full CRUD REST API example with SQLite and related entities"

[database]
driver = "sqlite"
url = "crud.db"

[[dependencies]]
group = "tinox.core"
artifactId = "db"
version = "1.2.6"

[[dependencies]]
group = "tinox.core"
artifactId = "http_server"
version = "1.2.5"

[[dependencies]]
group = "tinox.core"
artifactId = "json"
version = "1.1.5"
