[package]
compiler = "2.7.0"
name = "keycloak_oidc_api"
version = "0.1.0"
description = "REST endpoint protected by a role in an OIDC access token, verified live against a real Keycloak IdP (see docker-compose.yml)"

[[dependencies]]
group = "tinox.core"
artifactId = "http_server"
version = "1.1.0"

[[dependencies]]
group = "tinox.core"
artifactId = "json"
version = "1.1.0"

[[dependencies]]
group = "tinox.core"
artifactId = "oidc"
version = "1.1.0"

[[dependencies]]
group = "tinox.core"
artifactId = "rest"
version = "1.1.0"
