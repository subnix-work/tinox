[package]
compiler = "2.9.10"
name = "tinox_ui_js_component_demo"
version = "0.1.0"
description = "Tinox-UI JsComponent demo: wraps a real browser custom element (a client-only counter) via Component::jsComponent instead of Component::html() string-concatenation."

[[dependencies]]
group = "tinox.core"
artifactId = "ui"
version = "1.1.15"

[[dependencies]]
group = "tinox.core"
artifactId = "http_server"
version = "1.2.14"

[[dependencies]]
group = "tinox.core"
artifactId = "websocket"
version = "1.1.14"

[[dependencies]]
group = "tinox.core"
artifactId = "json"
version = "1.1.12"
